# ==============================================================================
# K-PANEL DISPOSABLE STAGING INGRESS (UNPRIVILEGED NGINX CONFIGURATION)
# Routes exclusively to disposable candidate on dedicated staging network.
# Strict invariants: No TLS, no ACME, no admin API, no production network access.
# ==============================================================================

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;

    # Temp paths placed on tmpfs for read-only rootfs compatibility
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Upstream pointing strictly to the candidate service name
    upstream candidate_backend {
        server candidate:8080;
        keepalive 16;
    }

    server {
        # Internal unprivileged port 8080 (published via 127.0.0.1:<loopback-port>:8080)
        listen 8080 default_server;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Kpanel-Staging-Ingress "isolated-loopback" always;

        # Healthcheck proxy
        location /healthz {
            proxy_pass http://candidate_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        # Candidate application proxy
        location / {
            proxy_pass http://candidate_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
    }
}
